<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação não validada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="card border-0 shadow-sm mx-auto" style="max-width: 640px;">
            <div class="card-body p-4 p-md-5 text-center">
                <i class="fas fa-shield-halved fa-3x text-warning mb-3" aria-hidden="true"></i>
                <h1 class="h3">Não foi possível validar esta solicitação</h1>
                <p class="text-muted mb-4">
                    A página ou a sessão pode ter expirado. Atualize a página e tente novamente.
                </p>
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-arrow-left me-2" aria-hidden="true"></i>Voltar ao sistema
                </a>
            </div>
        </div>
    </main>
</body>
</html>

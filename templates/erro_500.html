<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Falha interna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/autenticacao.css') }}">
</head>
<body class="bg-light">
    <main class="container py-5">
        <section class="card border-0 shadow-sm mx-auto limite-largura-erro">
            <div class="card-body p-4 text-center">
                <h1 class="h4">Não foi possível concluir a solicitação</h1>
                <p class="text-muted mb-3">
                    Ocorreu uma falha interna. Tente novamente mais tarde.
                </p>
                {% if request_id %}
                <p class="small text-muted">
                    Código de referência: <code>{{ request_id }}</code>
                </p>
                {% endif %}
                <a class="btn btn-primary" href="{{ url_for('index') }}">Voltar ao início</a>
            </div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marechal Aterro Zero · RECIC3{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('esg.static', filename='css/modulo.css') }}">
</head>
<body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
        <div class="shell header-content">
            <a class="brand" href="{{ url_for('index') }}" aria-label="RECIC3 — Painel principal">RECIC3<span>Gestão e sustentabilidade</span></a>
            <nav class="header-actions" aria-label="Navegação principal">
                <a class="button button-outline" href="{{ url_for('index') }}">Painel principal</a>
                <form method="POST" action="{{ url_for('logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="button button-outline" type="submit">Sair</button>
                </form>
            </nav>
        </div>
    </header>
    <main id="conteudo" class="shell main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="shell site-footer">RECIC3 · Marechal Aterro Zero</footer>
</body>
</html>

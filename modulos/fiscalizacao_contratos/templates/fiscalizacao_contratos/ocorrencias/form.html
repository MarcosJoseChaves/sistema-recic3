{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}{{ 'Nova' if modo=='nova' else 'Editar' }} ocorrência{% endblock %}{% block page_title %}{{ 'Nova ocorrência' if modo=='nova' else 'Editar ocorrência' }}{% endblock %}{% block content %}
<form method="post" class="card content-card"><div class="card-body"><div class="row g-3"><div class="col-lg-6"><label class="form-label">Contrato *</label><select class="form-select" name="contrato_id" required><option value="">Selecione</option>{% for c in contratos %}<option value="{{ c.id }}" {% if ocorrencia.contrato_id==c.id %}selected{% endif %}>{{ c.numero_contrato }}</option>{% endfor %}</select></div><div class="col-lg-6"><label class="form-label">Servidor responsável *</label><select class="form-select" name="servidor_responsavel_id" required><option value="">Selecione</option>{% for s in servidores %}<option value="{{ s.id }}" {% if ocorrencia.servidor_responsavel_id==s.id %}selected{% endif %}>{{ s.nome }} — {{ s.matricula }}</option>{% endfor %}</select></div>
<div class="col-lg-6"><label class="form-label">Fiscalização relacionada</label><select class="form-select" name="fiscalizacao_id"><option value="">Não vinculada</option>{% for f in fiscalizacoes %}<option value="{{ f.id }}" {% if ocorrencia.fiscalizacao_id==f.id %}selected{% endif %}>{{ f.data_fiscalizacao|fc_data }} — {{ f.objeto_verificado|truncate(55) }}</option>{% endfor %}</select></div><div class="col-lg-6"><label class="form-label">Ativo contratual</label><select class="form-select" name="ativo_contratual_id"><option value="">Não vinculado</option>{% for a in ativos %}<option value="{{ a.id }}" {% if ocorrencia.ativo_contratual_id==a.id %}selected{% endif %}>{{ a.codigo_interno }} — {{ a.descricao }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Título *</label><input class="form-control" name="titulo" maxlength="200" value="{{ ocorrencia.titulo or '' }}" required></div><div class="col-md-6"><label class="form-label">Categoria *</label><select class="form-select" name="categoria" required><option value="">Selecione</option>{% for x in categorias %}<option {% if ocorrencia.categoria==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Gravidade *</label><select class="form-select" name="gravidade" required><option value="">Selecione</option>{% for x in gravidades %}<option {% if ocorrencia.gravidade==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Descrição *</label><textarea class="form-control" name="descricao" rows="4" required>{{ ocorrencia.descricao or '' }}</textarea></div><div class="col-md-6"><label class="form-label">Data da identificação *</label><input class="form-control" type="date" name="data_identificacao" value="{{ ocorrencia.data_identificacao|fc_data_iso }}" required></div><div class="col-md-6"><label class="form-label">Prazo para correção</label><input class="form-control" type="date" name="prazo_correcao" value="{{ ocorrencia.prazo_correcao|fc_data_iso }}"></div>
<div class="col-md-4 form-check ms-2"><input class="form-check-input" type="checkbox" name="exige_notificacao" id="notificacao" {% if ocorrencia.exige_notificacao %}checked{% endif %}><label class="form-check-label" for="notificacao">Exige notificação</label></div><div class="col-md-7"><label class="form-label">Número da notificação</label><input class="form-control" name="numero_notificacao" value="{{ ocorrencia.numero_notificacao or '' }}"></div><div class="col-12"><label class="form-label">Conclusão</label><textarea class="form-control" name="conclusao" rows="2">{{ ocorrencia.conclusao or '' }}</textarea></div></div></div><div class="card-footer d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.ocorrencias_lista') }}">Cancelar</a><button class="btn btn-danger">Salvar</button></div></form>{% endblock %}

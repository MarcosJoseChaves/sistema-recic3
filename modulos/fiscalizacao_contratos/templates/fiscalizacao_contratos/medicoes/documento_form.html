{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}Vincular documento{% endblock %}{% block content %}<h2>Vincular documento à medição {{ medicao.numero_medicao }}</h2>
<div class="alert alert-info">O arquivo já armazenado será apenas relacionado à medição. Nenhuma cópia será criada.</div>
<form method="post" class="card content-card">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="documento_id">Documento *</label><select class="form-select" id="documento_id" name="documento_id" required><option value="">Selecione</option>{% for d in documentos %}<option value="{{ d.id }}" {% if vinculo.documento_id == d.id %}selected{% endif %}>{{ d.titulo }} — {{ d.nome_original }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="categoria">Categoria *</label><select class="form-select" id="categoria" name="categoria" required><option value="">Selecione</option>{% for c in categorias %}<option {% if vinculo.categoria == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea class="form-control" id="observacoes" name="observacoes">{{ vinculo.observacoes|default('', true) }}</textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Vincular</button> <a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.medicoes_detalhe',medicao_id=medicao.id) }}">Cancelar</a></div></form>{% endblock %}

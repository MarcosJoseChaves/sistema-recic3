{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<h2>{{ titulo }}</h2><div class="alert alert-warning">{{ aviso }}</div><form method="post" class="card content-card">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body">{% if exigir_aprovador %}<label class="form-label" for="servidor_aprovador_id">Servidor aprovador *</label><select class="form-select mb-3" id="servidor_aprovador_id" name="servidor_aprovador_id" required><option value="">Selecione</option>{% for s in servidores %}<option value="{{ s.id }}" {% if servidor_aprovador_id == s.id %}selected{% endif %}>{{ s.nome }} — {{ s.matricula }}</option>{% endfor %}</select>{% else %}<label class="form-label" for="justificativa">Justificativa *</label><textarea class="form-control" id="justificativa" name="justificativa" rows="4" required>{{ justificativa }}</textarea>{% endif %}</div><div class="card-footer"><button class="btn btn-primary">Confirmar</button> <a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.medicoes_detalhe',medicao_id=medicao.id) }}">Cancelar</a></div></form>{% endblock %}

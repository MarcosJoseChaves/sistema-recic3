{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}Vincular ativo{% endblock %}{% block page_title %}Vincular ativo a contrato{% endblock %}{% block content %}<div class="alert alert-light border"><strong>{{ ativo.codigo_interno }}</strong> — {{ ativo.descricao }}</div><div class="card content-card"><div class="card-body"><form method="post" class="row g-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-7"><label class="form-label" for="contrato_id">Contrato *</label><select class="form-select" id="contrato_id" name="contrato_id" required><option value="">Selecione</option>{% for c in contratos %}<option value="{{ c.id }}" {{ 'selected' if vinculo.contrato_id==c.id }}>{{ c.numero_contrato }}{{ ' (inativo)' if not c.ativo }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label" for="natureza_vinculo">Natureza *</label><select class="form-select" id="natureza_vinculo" name="natureza_vinculo" required><option value="">Selecione</option>{% for n in naturezas %}<option {{ 'selected' if vinculo.natureza_vinculo==n }}>{{ n }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label" for="data_inicio">Data inicial *</label><input class="form-control" type="date" id="data_inicio" name="data_inicio" required value="{{ vinculo.data_inicio|fc_data_iso }}"></div><div class="col-md-4"><label class="form-label" for="data_fim">Data final opcional</label><input class="form-control" type="date" id="data_fim" name="data_fim" value="{{ vinculo.data_fim|fc_data_iso }}"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="principal" name="principal" value="1" {{ 'checked' if vinculo.principal }}><label class="form-check-label" for="principal">Ativo principal neste contrato</label></div></div><div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea class="form-control" id="observacoes" name="observacoes">{{ vinculo.observacoes or '' }}</textarea></div><div class="col-12 d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.ativos_detalhe', ativo_id=ativo.id) }}">Cancelar</a><button class="btn btn-primary">Criar vínculo</button></div></form></div></div>{% endblock %}

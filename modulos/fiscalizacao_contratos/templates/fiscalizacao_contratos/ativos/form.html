{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}{{ 'Editar' if modo=='editar' else 'Novo' }} ativo{% endblock %}{% block page_title %}{{ 'Editar ativo contratual' if modo=='editar' else 'Novo ativo contratual' }}{% endblock %}
{% block content %}<div class="card content-card"><div class="card-body"><form method="post" class="row g-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-4"><label class="form-label" for="codigo_interno">Código interno *</label><input class="form-control" id="codigo_interno" name="codigo_interno" required maxlength="100" value="{{ ativo.codigo_interno or '' }}"></div>
<div class="col-md-4"><label class="form-label" for="tipo_ativo">Tipo *</label><select class="form-select" id="tipo_ativo" name="tipo_ativo" required><option value="">Selecione</option>{% for x in tipos_ativo %}<option {{ 'selected' if ativo.tipo_ativo==x }}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label" for="situacao">Situação *</label><select class="form-select" id="situacao" name="situacao" required>{% for x in situacoes_ativo %}<option {{ 'selected' if ativo.situacao==x }}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label" for="descricao">Descrição *</label><input class="form-control" id="descricao" name="descricao" required value="{{ ativo.descricao or '' }}"></div>
<div class="col-md-4"><label class="form-label" for="marca">Marca</label><input class="form-control" id="marca" name="marca" value="{{ ativo.marca or '' }}"></div><div class="col-md-4"><label class="form-label" for="modelo">Modelo</label><input class="form-control" id="modelo" name="modelo" value="{{ ativo.modelo or '' }}"></div><div class="col-md-4"><label class="form-label" for="ano_fabricacao">Ano de fabricação</label><input class="form-control" type="number" id="ano_fabricacao" name="ano_fabricacao" value="{{ ativo.ano_fabricacao or '' }}"></div>
<div class="col-md-4"><label class="form-label" for="placa">Placa</label><input class="form-control text-uppercase" id="placa" name="placa" value="{{ ativo.placa or '' }}"></div><div class="col-md-4"><label class="form-label" for="renavam">Renavam</label><input class="form-control" id="renavam" name="renavam" value="{{ ativo.renavam or '' }}"></div><div class="col-md-4"><label class="form-label" for="chassi">Chassi</label><input class="form-control text-uppercase" id="chassi" name="chassi" value="{{ ativo.chassi or '' }}"></div>
<div class="col-md-6"><label class="form-label" for="numero_serie">Número de série</label><input class="form-control" id="numero_serie" name="numero_serie" value="{{ ativo.numero_serie or '' }}"></div><div class="col-md-6"><label class="form-label" for="numero_patrimonio">Número de patrimônio</label><input class="form-control" id="numero_patrimonio" name="numero_patrimonio" value="{{ ativo.numero_patrimonio or '' }}"></div>
<div class="col-md-4"><label class="form-label" for="origem_ativo">Origem *</label><select class="form-select" id="origem_ativo" name="origem_ativo" required><option value="">Selecione</option>{% for x in origens_ativo %}<option {{ 'selected' if ativo.origem_ativo==x }}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-8"><label class="form-label" for="empresa_proprietaria_id">Empresa proprietária</label><select class="form-select" id="empresa_proprietaria_id" name="empresa_proprietaria_id"><option value="">Não informada</option>{% for e in empresas %}<option value="{{ e.id }}" {{ 'selected' if ativo.empresa_proprietaria_id==e.id }}>{{ e.razao_social }}{{ ' (inativa)' if not e.ativo }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label" for="capacidade">Capacidade</label><input class="form-control" inputmode="decimal" id="capacidade" name="capacidade" value="{{ ativo.capacidade|default('')|fc_decimal }}"></div><div class="col-md-6"><label class="form-label" for="unidade_capacidade">Unidade da capacidade</label><input class="form-control" id="unidade_capacidade" name="unidade_capacidade" value="{{ ativo.unidade_capacidade or '' }}" placeholder="Ex.: toneladas, litros, m²"></div>
<div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea class="form-control" id="observacoes" name="observacoes" rows="3">{{ ativo.observacoes or '' }}</textarea></div>
<div class="col-12 d-flex flex-column flex-sm-row justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.ativos_lista') }}">Cancelar</a><button class="btn btn-primary"><i class="fas fa-save me-1"></i>Salvar</button></div></form></div></div>{% endblock %}

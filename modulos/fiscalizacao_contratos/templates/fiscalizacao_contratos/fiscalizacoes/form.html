{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}{{ 'Nova' if modo=='nova' else 'Editar' }} fiscalização{% endblock %}{% block page_title %}{{ 'Nova fiscalização' if modo=='nova' else 'Editar fiscalização' }}{% endblock %}
{% block content %}<form method="post" class="card content-card">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body"><div class="row g-3">
<div class="col-lg-6"><label class="form-label">Contrato *</label><select class="form-select" name="contrato_id" required><option value="">Selecione</option>{% for c in contratos %}<option value="{{ c.id }}" {% if fiscalizacao.contrato_id==c.id %}selected{% endif %}>{{ c.numero_contrato }} — {{ c.empresa_nome }}</option>{% endfor %}</select></div>
<div class="col-lg-6"><label class="form-label">Servidor responsável *</label><select class="form-select" name="servidor_responsavel_id" required><option value="">Selecione</option>{% for s in servidores %}<option value="{{ s.id }}" {% if fiscalizacao.servidor_responsavel_id==s.id %}selected{% endif %}>{{ s.nome }} — {{ s.matricula }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Data *</label><input class="form-control" type="date" name="data_fiscalizacao" value="{{ fiscalizacao.data_fiscalizacao|fc_data_iso }}" required></div><div class="col-md-4"><label class="form-label">Início</label><input class="form-control" type="time" name="hora_inicio" value="{{ fiscalizacao.hora_inicio.strftime('%H:%M') if fiscalizacao.hora_inicio else '' }}"></div><div class="col-md-4"><label class="form-label">Fim</label><input class="form-control" type="time" name="hora_fim" value="{{ fiscalizacao.hora_fim.strftime('%H:%M') if fiscalizacao.hora_fim else '' }}"></div>
<div class="col-md-6"><label class="form-label">Tipo *</label><select class="form-select" name="tipo_fiscalizacao" required><option value="">Selecione</option>{% for x in tipos %}<option {% if fiscalizacao.tipo_fiscalizacao==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Resultado *</label><select class="form-select" name="resultado" required><option value="">Selecione</option>{% for x in resultados %}<option {% if fiscalizacao.resultado==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Local</label><input class="form-control" name="local_fiscalizacao" value="{{ fiscalizacao.local_fiscalizacao or '' }}"></div><div class="col-12"><label class="form-label">Objeto verificado *</label><textarea class="form-control" name="objeto_verificado" rows="3" required>{{ fiscalizacao.objeto_verificado or '' }}</textarea></div><div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" name="observacoes" rows="3">{{ fiscalizacao.observacoes or '' }}</textarea></div>
</div></div><div class="card-footer d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.fiscalizacoes_lista') }}">Cancelar</a><button class="btn btn-primary">Salvar</button></div></form>{% endblock %}

{% extends "fiscalizacao_contratos/layout.html" %}{% block title %}Vincular documento{% endblock %}{% block content %}<h2>Vincular documento complementar</h2><div class="alert alert-info">O documento já armazenado será apenas relacionado ao ateste. O arquivo físico não será duplicado.</div><form method="post" class="card content-card">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body"><div class="row g-3"><div class="col-md-7"><label class="form-label">Documento *</label><select class="form-select" name="documento_id" required><option value="">Selecione</option>{% for d in documentos %}<option value="{{ d.id }}" {% if vinculo.documento_id==d.id %}selected{% endif %}>{{ d.titulo }} — {{ d.nome_original }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">Categoria *</label><select class="form-select" name="categoria" required><option value="">Selecione</option>{% for c in categorias %}<option {% if vinculo.categoria==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" name="observacoes">{{ vinculo.observacoes|default('',true) }}</textarea></div></div></div><div class="card-footer"><button class="btn btn-primary">Vincular</button> <a class="btn btn-outline-secondary" href="{{ url_for('fiscalizacao_contratos.atestes_detalhe',ateste_id=ateste.id) }}">Cancelar</a></div></form>{% endblock %}
